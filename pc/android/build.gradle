// Top-level build file (from SDL2's android-project template: Android Gradle Plugin 8.5.2 with Gradle 8.7, JDK 17: AGP 8.5.1+ aligns the native libraries to 16 KB pages, T8).
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
