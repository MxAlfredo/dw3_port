# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: megaseadramon
kind: character
view: topdown
size: 64
directions: 8
mirror: false

# MegaSeadramon — fan-game interpretation based on the supplied references.
# Axes: +X character's left, +Y up, +Z forward.
# Long coiled sea-serpent body, red armored back, pale underside,
# golden horned dragon head, green mane, purple armor bands and fins.

camera: {pitch: 38, scale: 0.034, center: [0, 0.48, -0.12]}
shadow: {rx: 17, ry: 7, alpha: 85}
light: {dir: [-0.55, 1, 0.45], rim: [0.8, 0.35, -0.9], rim_strength: 0.32, ambient: 0.24}
render: {outline: dark, shading: toon, lines: depth, highlights: true, crease_angle: 48, min_run: 2}

brief:
  summary: >-
    MegaSeadramon, a powerful long-bodied sea serpent. Its thick serpentine
    body coils in a compact S curve, with a crimson-red armored back,
    pale silver-white underside, dark violet armor bands, long red side fins
    and spikes. The narrow dragon head has a long ivory-gold armored snout,
    an open purple mouth with small ivory teeth, a cyan eye, two long swept
    golden horns and a flowing dark-green mane behind the skull.
  head: >-
    Long wedge-shaped golden dragon muzzle pointing forward, narrow cyan eye,
    open jaw, two swept-back gold horns. Keep the head visually distinct
    from the red body.
  must_keep:
    - long coiled serpentine silhouette
    - gold dragon head and long narrow snout
    - two long swept-back golden horns
    - cyan eye and open purple mouth with teeth
    - flowing green mane behind the head
    - crimson armored body with pale silver underside
    - violet bands and red dorsal/side spikes
  simplify:
    - keep the coil broad and readable at 64 pixels
    - merge tiny teeth into a few visible ivory points
    - use only a few large armor bands and fins
    - avoid thin details that collapse below one pixel

ramps:
  armor: ['#321c25', '#8d3037', '#bd4548', '#e36a62', '#f29a82']
  belly: ['#424b55', '#89949d', '#c4cdd2', '#e8edef', '#ffffff']
  gold: ['#654526', '#b68a42', '#e0bd70', '#f4dfa0', '#fff0c4']
  green: ['#18351e', '#365d2c', '#59833a', '#83a94b', '#b5c978']
  violet: ['#211b38', '#40345e', '#65517f', '#88719d']
  mouth: ['#381d38', '#713b69', '#a65c91', '#d58bb6']
  tooth: ['#6e634b', '#c9bd91', '#eee2b9', '#fff5d8']
  eye: ['#164b58', '#16899b', '#51d3d1', '#b5ffff']
  ink: ['#17171b', '#17171b', '#17171b', '#17171b']

materials:
  armor: {ramp: armor, finish: soft, crease: true}
  belly: {ramp: belly, finish: matte}
  gold: {ramp: gold, finish: metal, edge_highlight: true}
  green: {ramp: green, finish: soft}
  violet: {ramp: violet, finish: metal, edge_highlight: true}
  mouth: {ramp: mouth, finish: glossy}
  tooth: {ramp: tooth, finish: matte}
  eye: {ramp: eye, finish: glossy, emissive: true, band: 3, glow: {color: '#4fe8e1', mix: 0.18, radius: 1}}
  ink: {ramp: ink, emissive: true, band: 1, outline: false}

channels:
  root: [0, 0, 0]
  bob: 0
  body_sway: 0
  head_pitch: 0
  head_yaw: 0
  jaw: 0.35
  mane_sway: 0
  tail_sway: 0
  fin_flare: 0

bones:
  body:
    parent: root
    pos: '[0, 0.24 + bob, 0]'
    rot: '[0, body_sway, 0]'
  neck:
    parent: body
    pos: [0, 0.06, 0.48]
    rot: '[0, 0, 0]'
  head:
    parent: neck
    pos: [0, 0.10, 0.12]
    rot: '[head_pitch, head_yaw, 0]'
  jawb:
    parent: head
    pos: [0, -0.085, 0.12]
    rot: '[0.42*jaw, 0, 0]'
  mane:
    parent: neck
    pos: [0, 0.12, -0.05]
    rot: '[0, 0, 0.12*mane_sway]'
  tail:
    parent: body
    pos: [0.12, 0, -0.92]
    rot: '[0, tail_sway, 0]'

parts:
  # Main coiled serpent body. One smooth tube keeps the silhouette continuous.
  body_coil:
    material: armor
    space: body
    blend: 0.06
    prims:
      - tube:
          pts:
            - [0.00, 0.02, 0.42]
            - [0.18, 0.00, 0.18]
            - [0.38, 0.00, -0.06]
            - [0.53, 0.00, -0.34]
            - [0.47, 0.00, -0.61]
            - [0.22, 0.00, -0.78]
            - [-0.12, 0.00, -0.78]
            - [-0.39, 0.00, -0.60]
            - [-0.46, 0.00, -0.34]
            - [-0.29, 0.00, -0.15]
            - [0.02, 0.00, -0.18]
            - [0.30, 0.00, -0.35]
          r: [0.17, 0.105]

  # Pale ventral stripe follows the inside/front-facing sweep of the coil.
  belly_sweep:
    material: belly
    space: body
    priority: 2
    prims:
      - tube:
          pts:
            - [0.00, -0.105, 0.39]
            - [0.16, -0.105, 0.17]
            - [0.34, -0.105, -0.07]
            - [0.47, -0.105, -0.34]
            - [0.41, -0.105, -0.58]
            - [0.19, -0.105, -0.73]
            - [-0.10, -0.105, -0.73]
            - [-0.34, -0.105, -0.57]
            - [-0.40, -0.105, -0.35]
            - [-0.25, -0.105, -0.18]
          r: [0.105,  0.075]

  # Violet armor rings across the back at readable intervals.
  band_1:
    material: violet
    space: body
    priority: 3
    prims:
      - torus: {c: [0.43, 0.015, -0.22], R: 0.158, r: 0.025, rot: [1.5708, 0, 0]}
  band_2:
    material: violet
    space: body
    priority: 3
    prims:
      - torus: {c: [0.31, 0.015, -0.68], R: 0.15, r: 0.024, rot: [1.5708, 0, 0]}
  band_3:
    material: violet
    space: body
    priority: 3
    prims:
      - torus: {c: [-0.34, 0.015, -0.53], R: 0.15, r: 0.024, rot: [1.5708, 0, 0]}

  # Head: elongated golden armored skull and tapered snout.
  skull:
    material: gold
    space: head
    blend: 0.035
    prims:
      - ellipsoid: {c: [0, 0.015, 0.03], r: [0.205, 0.145, 0.23]}
      - ellipsoid: {c: [0, -0.005, 0.25], r: [0.145, 0.105, 0.29]}
      - cone: {a: [0, 0.005, 0.39], b: [0, -0.005, 0.61], r: [0.115, 0.025]}

  # Upper muzzle ridge / nasal armor.
  muzzle_ridge:
    material: gold
    space: head
    prims:
      - tube:
          pts: [[0, 0.095, 0.03], [0, 0.085, 0.22], [0, 0.055, 0.43], [0, 0.025, 0.58]]
          r: [0.075, 0.018]

  # Lower jaw and dark mouth cavity.
  lower_jaw:
    material: belly
    space: jawb
    blend: 0.025
    prims:
      - ellipsoid: {c: [0, -0.025, 0.15], r: [0.15, 0.045, 0.25]}
      - cone: {a: [0, -0.015, 0.28], b: [0, -0.01, 0.48], r: [0.085, 0.018]}

  mouth_cavity:
    material: mouth
    space: jawb
    when: 'jaw > 0.15'
    priority: 4
    prims:
      - ellipsoid: {c: [0, 0.025, 0.16], r: [0.12, 0.018, 0.20]}

  tongue:
    material: mouth
    space: jawb
    when: 'jaw > 0.35'
    priority: 5
    prims:
      - ellipsoid: {c: [0, 0.045, 0.19], r: [0.065, 0.012, 0.14]}

  # Teeth: a few large visible points rather than dozens of tiny spikes.
  tooth_upper_L:
    material: tooth
    space: head
    priority: 5
    prims:
      - cone: {a: [0.105, -0.065, 0.30], b: [0.09, -0.14, 0.29], r: [0.026, 0.002]}
      - cone: {a: [0.145, -0.065, 0.17], b: [0.13, -0.13, 0.16], r: [0.022, 0.002]}
  tooth_lower_L:
    material: tooth
    space: jawb
    priority: 5
    prims:
      - cone: {a: [0.09, 0.055, 0.22], b: [0.085, 0.105, 0.22], r: [0.022, 0.002]}

  # Cyan eye, dark pupil and glint on the visible side; _R is mirrored automatically.
  eye_L:
    material: eye
    space: head
    priority: 4
    prims:
      - ellipsoid: {c: [0.157, 0.075, 0.12], r: [0.035, 0.045, 0.065]}
  pupil_L:
    material: ink
    space: head
    priority: 5
    prims:
      - ellipsoid: {c: [0.177, 0.079, 0.135], r: [0.012, 0.027, 0.033]}
  eye_glint_L:
    material: tooth
    space: head
    priority: 6
    prims:
      - sphere: {c: [0.183, 0.102, 0.157], r: 0.012}

  # Two swept-back gold horns.
  horn_L:
    material: gold
    space: head
    priority: 3
    prims:
      - tube:
          pts: [[0.12, 0.105, -0.02], [0.20, 0.17, -0.13], [0.29, 0.23, -0.27], [0.34, 0.26, -0.39]]
          r: [0.075, 0.004]
  # Smaller cheek / temple spikes.
  temple_spike_L:
    material: gold
    space: head
    priority: 3
    prims:
      - cone: {a: [0.16, 0.035, -0.02], b: [0.29, 0.07, -0.13], r: [0.055, 0.003]}

  # Flowing green mane behind the skull.
  mane_lock_1:
    material: green
    space: mane
    priority: 2
    prims:
      - tube:
          pts: [[0.00, 0.04, -0.02], [0.10, 0.07, -0.16], [0.20, 0.08, -0.31], [0.28, 0.05, -0.43]]
          r: [0.075, 0.004]
  mane_lock_2:
    material: green
    space: mane
    priority: 2
    prims:
      - tube:
          pts: [[-0.035, 0.09, -0.02], [-0.02, 0.15, -0.17], [0.04, 0.16, -0.33], [0.10, 0.13, -0.46]]
          r: [0.065, 0.003]
  mane_lock_3:
    material: green
    space: mane
    priority: 2
    prims:
      - tube:
          pts: [[-0.08, 0.025, -0.02], [-0.16, 0.07, -0.16], [-0.24, 0.08, -0.30], [-0.30, 0.04, -0.39]]
          r: [0.065, 0.003]

  # Red dorsal spines along the outer curve of the body.
  spine_1:
    material: armor
    space: body
    priority: 3
    prims:
      - cone: {a: [0.39, 0.08, -0.10], b: [0.57, 0.16, -0.02], r: [0.075, 0.002]}
  spine_2:
    material: armor
    space: body
    priority: 3
    prims:
      - cone: {a: [0.51, 0.07, -0.43], b: [0.70, 0.15, -0.40], r: [0.070, 0.002]}
  spine_3:
    material: armor
    space: body
    priority: 3
    prims:
      - cone: {a: [0.31, 0.07, -0.77], b: [0.43, 0.15, -0.91], r: [0.065, 0.002]}
  spine_4:
    material: armor
    space: body
    priority: 3
    prims:
      - cone: {a: [-0.35, 0.07, -0.55], b: [-0.49, 0.15, -0.68], r: [0.065, 0.002]}

  # Broad red lateral fins. Their chunky profile survives pixelization.
  fin_outer_L:
    material: armor
    space: body
    priority: 2
    prims:
      - extrude:
          c: [0.48, 0.015, -0.28]
          rot: [0, 0.15, 0]
          depth: 0.045
          round: 0.012
          profile:
            polygon:
              [[-0.06, -0.04], [0.04, 0.12], [0.20, 0.23], [0.34, 0.18], [0.24, 0.08], [0.15, -0.08], [0.02, -0.12]]
  fin_tail_L:
    material: armor
    space: tail
    priority: 2
    prims:
      - extrude:
          c: [0.04, 0.02, -0.12]
          rot: [0, 0.25, 0]
          depth: 0.035
          round: 0.01
          profile:
            polygon:
              [[-0.03, -0.04], [0.04, 0.10], [0.20, 0.18], [0.28, 0.10], [0.12, 0.04], [0.02, -0.10]]

  # Tapered tail continuing the serpent's coil.
  tail_extension:
    material: armor
    space: tail
    prims:
      - tube:
          pts: [[0.00, 0.00, -0.02], [-0.10, 0.00, -0.20], [-0.24, 0.00, -0.36], [-0.34, 0.00, -0.48]]
          r: [0.12, 0.018]

animations:
  stand:
    frames: 4
    ms: 180
    channels:
      bob: '0.004*sin(p)'
      body_sway: '0.018*sin(p)'
      mane_sway: '0.12*sin(p)'
      tail_sway: '0.035*sin(p)'
      jaw: '0.28 + 0.05*sin(p)'

  idle:
    frames: 8
    ms: 120
    channels:
      bob: '0.008*sin(p)'
      body_sway: '0.035*sin(p)'
      mane_sway: '0.20*sin(p)'
      tail_sway: '0.07*sin(p)'
      jaw: '0.30 + 0.10*(0.5 + 0.5*sin(p))'

  swim:
    frames: 8
    ms: 95
    channels:
      body_sway: '0.075*sin(p)'
      mane_sway: '0.28*sin(p)'
      tail_sway: '0.16*sin(p)'
      bob: '0.018*sin(2*p)'

  attack:
    frames: 6
    ms: 90
    channels:
      head_pitch: '-0.12*pulse(f, 1, 1.2)'
      jaw: '0.35 + 0.65*pulse(f, 2, 2)'
      body_sway: '0.08*pulse(f, 2, 2)'
      mane_sway: '0.30*pulse(f, 2, 2)'
      tail_sway: '-0.18*pulse(f, 3, 2)'
